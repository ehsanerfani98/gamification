name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Code style & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, dom, xml, zip, fileinfo, curl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Missing .env -> dotenv warning on every test + APP_KEY required by auth tests
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Prepare SQLite database
        run: touch database/database.sqlite

      # Blade hostهای /panel و /c/{slug} از @vite استفاده می‌کنند؛
      # بدون manifest، رندر blade در تست 500 می‌دهد (ViteManifestNotFoundException)
      - name: Build frontend (Vite manifest)
        run: npm ci && npm run build

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test
